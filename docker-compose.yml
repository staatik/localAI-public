services:
  # --- Reverse Proxy ---
  nginx:
    image: nginx:alpine
    container_name: gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /home/openwebui/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /home/openwebui/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      openwebui:
        condition: service_healthy
      n8n:
        condition: service_started
      searxng:
        condition: service_started
    networks:
      - ai_net
    restart: always

  # --- OpenWebUI ---
  openwebui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: openwebui
    environment:
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:?Set WEBUI_SECRET_KEY in .env}
      # Vector DB
      - VECTOR_DB=qdrant
      - QDRANT_URI=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:?Set QDRANT_API_KEY in .env}
      # Web search
      - ENABLE_RAG_WEB_SEARCH=True
      - RAG_WEB_SEARCH_ENGINE=searxng
      - SEARXNG_QUERY_URL=http://searxng:8080/search?q=<query>
      - RAG_WEB_SEARCH_RESULT_COUNT=3
      - RAG_WEB_SEARCH_CONCURRENT_REQUESTS=1
      # Redis session/websocket state
      - REDIS_URL=redis://redis:6379
    volumes:
      - openwebui_data:/app/backend/data
    depends_on:
      searxng:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ai_net
    restart: always

  # --- n8n ---
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    volumes:
      - n8n_data:/home/node/.n8n
    environment:
      - WEBHOOK_URL=https://n8n.home.lan/
      - N8N_SECURE_COOKIE=false   # OK for internal-only; set true if exposed externally
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
    networks:
      - ai_net
    restart: always

  # --- Qdrant ---
  qdrant:
    image: qdrant/qdrant:v1.13.0
    container_name: qdrant
    expose:
      - "6333"
      - "6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:?Set QDRANT_API_KEY in .env}
    networks:
      - ai_net
    restart: always

  # --- SearXNG ---
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    volumes:
      - /home/openwebui/searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=https://search.home.lan/
      - SEARXNG_VALKEY_URL=redis://redis:6379/0
      - SEARXNG_SECRET=${SEARXNG_SECRET:?Set SEARXNG_SECRET in .env}
    networks:
      - ai_net
    restart: always

  # --- Redis ---
  redis:
    image: redis:alpine
    container_name: redis

    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai_net
    restart: always

networks:
  ai_net:
    driver: bridge

volumes:
  openwebui_data:
  n8n_data:
  qdrant_data:
  redis_data:
