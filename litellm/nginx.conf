events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Allow large model payloads and file uploads
    client_max_body_size 50M;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # --- Default: drop requests to raw IP or unknown domains ---
    server {
        listen 80 default_server;
        listen 443 default_server ssl;
        ssl_certificate     /etc/nginx/ssl/wildcard.crt;
        ssl_certificate_key /etc/nginx/ssl/wildcard.key;
        server_name _;
        return 444;
    }

    # --- Redirect HTTP -> HTTPS ---
    server {
        listen 80;
        server_name litellm.home.lan;
        return 301 https://$host$request_uri;
    }

    # --- LiteLLM Proxy + UI (litellm.home.lan) ---
    server {
        listen 443 ssl;
        server_name litellm.home.lan;
        ssl_certificate     /etc/nginx/ssl/wildcard.crt;
        ssl_certificate_key /etc/nginx/ssl/wildcard.key;

        # --- Proxy API ---
        # Handles all LiteLLM API calls (OpenAI-compatible endpoints)
        location / {
            proxy_pass http://litellm:4000;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Required for streaming responses (SSE)
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;

            # Long timeout for slow model responses
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # --- UI ---
        # LiteLLM serves its management UI at /ui
        location /ui {
            proxy_pass http://litellm:4000/ui;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for the UI
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 300s;
        }
    }
}
